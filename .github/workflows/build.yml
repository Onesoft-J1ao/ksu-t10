name: build

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Build stage'
        required: true
        default: overlay
        type: choice
        options: [overlay, kprobes, ksu]
      upload_boot:
        description: 'Also produce a repacked boot.img (needs boot.img in repo)'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'configs/**'
      - '.github/workflows/build.yml'

concurrency:
  group: build-${{ github.ref }}-${{ github.event.inputs.stage || 'overlay' }}
  cancel-in-progress: true

env:
  # Upstream is fast and public; the gh-proxy fallback in build-kernel.sh only
  # matters on the dev machine where direct GitHub is ~23 KB/s.
  KERNEL_REPO: https://github.com/iflytek/Kernel_OpenSource
  KERNEL_BRANCH: android_9_kernel_UD710_T10
  KERNEL_COMMIT: 04c31197bd8d415d0f00cfc8aa8573669e285b8a
  WANT_RELEASE: 4.14.98-g3ff394f6011d-dirty

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve stage
        id: s
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "stage=${{ github.event.inputs.stage }}" >> "$GITHUB_OUTPUT"
            echo "boot=${{ github.event.inputs.upload_boot }}" >> "$GITHUB_OUTPUT"
          else
            echo "stage=overlay" >> "$GITHUB_OUTPUT"
            echo "boot=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cross toolchain and kernel build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            build-essential bc bison flex libssl-dev libelf-dev \
            cpio xz-utils gzip python3 rsync kmod
          aarch64-linux-gnu-gcc --version | head -1
          # The build script expects a CROSS_COMPILE prefix it can append gcc to.
          mkdir -p "$HOME/bin"
          ln -sf /usr/bin/aarch64-linux-gnu-gcc-13 "$HOME/bin/aarch64-linux-gnu-gcc"
          for t in ar as ld nm objdump objcopy strip readelf ranlib strings size addr2line; do
            ln -sf "/usr/bin/aarch64-linux-gnu-$t" "$HOME/bin/aarch64-linux-gnu-$t"
          done
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Fetch kernel source at pinned commit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/src"
          cd "$RUNNER_TEMP/src"
          # shallow clone of just the one branch, then verify the tip commit.
          git init -q .
          git remote add origin "$KERNEL_REPO"
          git fetch -q --depth=1 origin "$KERNEL_BRANCH"
          git checkout -q FETCH_HEAD
          GOT=$(git rev-parse HEAD)
          echo "fetched $GOT"
          if [ "$GOT" != "$KERNEL_COMMIT" ]; then
            echo "::error::upstream tip $GOT != pinned $KERNEL_COMMIT"
            echo "If iflytek moved the branch, update KERNEL_COMMIT in this workflow." >&2
            exit 1
          fi
          du -sh .

      - name: Show config diff for the stage
        run: |
          set -euo pipefail
          base="$GITHUB_WORKSPACE/configs/t10-device.config"
          cp "$base" /tmp/base.config
          stage="${{ steps.s.outputs.stage }}"
          cp "$base" /tmp/stage.config
          case "$stage" in
            overlay) sed -i 's/^# CONFIG_OVERLAY_FS is not set/CONFIG_OVERLAY_FS=y/' /tmp/stage.config ;;
            kprobes|ksu)
              sed -i 's/^# CONFIG_OVERLAY_FS is not set/CONFIG_OVERLAY_FS=y/' /tmp/stage.config
              sed -i 's/^# CONFIG_KPROBES is not set/CONFIG_KPROBES=y/' /tmp/stage.config
              sed -i 's/^# CONFIG_KPROBE_EVENTS is not set/CONFIG_KPROBE_EVENTS=y/' /tmp/stage.config ;;
          esac
          make -C "$RUNNER_TEMP/src" O=/tmp/kc ARCH=arm64 KCONFIG_CONFIG=/tmp/stage.config olddefconfig >/dev/null
          echo '### Config delta vs device baseline' >> "$GITHUB_STEP_SUMMARY"
          echo '```diff' >> "$GITHUB_STEP_SUMMARY"
          diff <(grep -E '^CONFIG_|^# CONFIG_' /tmp/base.config | sort) \
               <(grep -E '^CONFIG_|^# CONFIG_' /tmp/stage.config | sort) >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Hard guard: this one switch invalidates every existing .ko.
          if grep -q '^CONFIG_FUNCTION_TRACER=y' /tmp/stage.config; then
            echo "::error::CONFIG_FUNCTION_TRACER=y would change module_layout CRC"
            exit 1
          fi

      - name: Build kernel
        env:
          KERNEL: ${{ runner.temp }}/src
        run: |
          set -euo pipefail
          chmod +x tools/build-kernel.sh
          tools/build-kernel.sh "${{ steps.s.outputs.stage }}"
          IMG="out/${{ steps.s.outputs.stage }}/arch/arm64/boot/Image"
          [ -f "$IMG" ] || { echo "::error::no Image produced"; exit 1; }
          echo "### Build result" >> "$GITHUB_STEP_SUMMARY"
          ls -l "$IMG" | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum "$IMG" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify kernelrelease and vermagic
        run: |
          set -euo pipefail
          OUT="out/${{ steps.s.outputs.stage }}"
          REL=$(cat "$OUT/include/config/kernel.release")
          echo "kernelrelease = $REL"
          [ "$REL" = "4.14.98-g3ff394f6011d-dirty" ] || { echo "::error::kernelrelease mismatch: $REL"; exit 1; }
          # Strings the device also reports, proving the build matches the vendor kernel.
          strings "$OUT/arch/arm64/boot/Image" | grep -m1 -E '^4\.14\.98' || true

      - name: Repack boot.img (optional)
        if: steps.s.outputs.boot == 'true'
        run: |
          set -euo pipefail
          if [ ! -f boot.img ]; then
            echo "::warning::boot.img not in repo; skipping repack (add it as boot.img at repo root to enable)"
            exit 0
          fi
          tag=$(curl -sSL https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          curl -sSL "https://github.com/topjohnwu/Magisk/releases/download/${tag}/Magisk-${tag}.apk" -o /tmp/magisk.apk
          unzip -o -q /tmp/magisk.apk 'lib/x86_64/libmagiskboot.so' -d /tmp/mb64
          mb=$(find /tmp/mb64 -name libmagiskboot.so | head -1)
          chmod +x "$mb"
          MAGISKBOOT="$mb" WORK="$RUNNER_TEMP/repack" tools/repack-boot.sh \
            boot.img "out/${{ steps.s.outputs.stage }}/arch/arm64/boot/Image" \
            "out/boot-${{ steps.s.outputs.stage }}.img"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ steps.s.outputs.stage }}-${{ github.sha }}
          path: |
            out/${{ steps.s.outputs.stage }}/arch/arm64/boot/Image
            out/${{ steps.s.outputs.stage }}/.config
            out/${{ steps.s.outputs.stage }}/build.log
            out/boot-*.img
          if-no-files-found: warn
          retention-days: 30
